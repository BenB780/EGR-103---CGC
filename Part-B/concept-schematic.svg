<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <rect width="1200" height="800" fill="#ffffff"/>
  <text x="600" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="bold">Concept Schematic: Cardboard Grain Carrier</text>

  <!-- main body -->
  <rect x="300" y="210" width="600" height="340" fill="#f4f4f4" stroke="#000" stroke-width="4"/>
  <rect x="410" y="130" width="380" height="90" fill="#eaeaea" stroke="#000" stroke-width="4"/>

  <!-- handle opening -->
  <rect x="500" y="145" width="220" height="60" fill="#ffffff" stroke="#000" stroke-width="3" stroke-dasharray="8 8"/>

  <!-- interior grain area -->
  <rect x="335" y="245" width="530" height="270" fill="#dfe8f7" stroke="#000" stroke-width="2"/>

  <!-- support tabs -->
  <rect x="275" y="230" width="25" height="80" fill="#d8d8d8" stroke="#000" stroke-width="2"/>
  <rect x="275" y="410" width="25" height="80" fill="#d8d8d8" stroke="#000" stroke-width="2"/>
  <rect x="900" y="230" width="25" height="80" fill="#d8d8d8" stroke="#000" stroke-width="2"/>
  <rect x="900" y="410" width="25" height="80" fill="#d8d8d8" stroke="#000" stroke-width="2"/>

  <!-- arrows and labels -->
  <line x1="600" y1="720" x2="600" y2="560" stroke="#000" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="620" y="650" font-family="Arial, sans-serif" font-size="26">8 in height</text>

  <line x1="250" y1="380" x2="300" y2="380" stroke="#000" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="120" y="388" font-family="Arial, sans-serif" font-size="26">10 in width</text>

  <line x1="600" y1="170" x2="600" y2="130" stroke="#000" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="620" y="150" font-family="Arial, sans-serif" font-size="22">Handle opening</text>

  <line x1="930" y1="380" x2="1040" y2="380" stroke="#000" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="1048" y="388" font-family="Arial, sans-serif" font-size="26">18 in length</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#000"/>
    </marker>
  </defs>
</svg>
